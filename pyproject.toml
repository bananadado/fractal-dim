[project]
name = "fractaldim"
version = "0.1.0"
description = "L-systems, exact box counting, and fractal dimension estimation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.5"]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0", "pyproj>=3.4", "requests>=2.28"]
dev = ["pytest>=7.0"]

[project.scripts]
fractaldim = "fractaldim.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fractaldim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
